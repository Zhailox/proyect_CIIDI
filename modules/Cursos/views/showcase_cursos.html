<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos UPTTMBI</title>
    
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
        --bg-dark: #0f172a;
        --bg-panel: #1a1f33;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --success: #10b981;
        --card-bg: #ffffff;
        --text-dark: #1e293b;
        --text-light-muted: #64748b;
        --bg-body: #f1f5f9;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    body {
        background-color: var(--bg-body);
        color: var(--text-dark);
        min-height: 100vh;
        padding: 2rem;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
    }

    /* Tarjetas y Contenedores */
    .card {
        background: var(--card-bg);
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        padding: 1.5rem;
        border: 1px solid #e2e8f0;
    }
    
    /* Botones */
    .btn-primary {
        background-color: var(--primary);
        color: white;
        padding: 0.5rem 1.5rem;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
        display: inline-block;
        text-align: center;
    }

    .btn-primary:hover {
        background-color: var(--primary-hover);
    }

    /* Encabezados y Banners */
    .header-banner {
        background: linear-gradient(135deg, var(--bg-dark), var(--bg-panel));
        color: white;
        padding: 3rem 2rem;
        border-radius: 8px;
        margin-bottom: 2rem;
    }

    .header-banner h1 {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        color: var(--text-main);
    }
    
    .header-banner p {
        color: var(--text-muted);
        font-size: 1.1rem;
    }

    /* Formularios */
    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--text-dark);
        font-size: 0.9rem;
    }

    .form-control {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.3s;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Grillas */
    .grid {
        display: grid;
        gap: 1.5rem;
    }

    .grid-3 {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    /* Tablas */
    .table-responsive {
        overflow-x: auto;
    }
    
    .table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
    }

    .table th, .table td {
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }

    .table th {
        background-color: var(--bg-panel);
        color: var(--text-main);
        font-weight: 600;
    }
    
    .table tr:nth-child(even) {
        background-color: #f8fafc;
    }

    .table tr:hover {
        background-color: #f1f5f9;
    }
    
    .badge {
        padding: 0.25rem 0.5rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        background-color: #e0f2fe;
        color: #0369a1;
    }
</style>

</head>
<body>
    <div class="container">

        <div class="header-banner" style="background: linear-gradient(135deg, #0ea5e9, #0284c7);">
            <h1>Formación Continua y Cursos</h1>
            <p>Potencia tus habilidades con nuestra oferta académica avalada.</p>
        </div>
        <div class="card" style="text-align: center; padding: 4rem 2rem; background: #f8fafc; margin-bottom: 3rem;">
            <h2 style="font-size: 2rem; color: var(--bg-panel); margin-bottom: 1rem;">Aprende con los mejores expertos de la UPTT</h2>
            <p style="color: var(--text-light-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 2rem auto;">Cursos diseñados para complementar tu formación académica, enfocados en tecnologías de vanguardia demandadas por el mercado.</p>
            <a href="grid_cursos.html" class="btn-primary" style="font-size: 1.1rem; padding: 0.8rem 2rem;">VER CATÁLOGO COMPLETO</a>
        </div>
        
    </div>
</body>
</html>
